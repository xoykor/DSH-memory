name: Smoke DSH-Backup web startup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/smoke-backup-web.yml

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: xoykor/DSH-Backup
          ref: master
          path: backup
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Restore clean DSH environment
        working-directory: backup
        run: ./restore-dsh.sh restore

      - name: Verify web profile has dsh-memory
        run: |
          ~/.local/bin/dsh --profile web --dump-config > /tmp/web-config.txt
          grep -n "id: memory" /tmp/web-config.txt
          grep -n "name: dsh-memory" /tmp/web-config.txt

      - name: Start web host
        run: |
          set +e
          timeout 20s ~/.local/bin/dsh web --no-open > /tmp/dsh-web.log 2>&1
          rc=$?
          cat /tmp/dsh-web.log
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ]; then
            exit "$rc"
          fi
          grep -Eiq "http://|https://|listening|server|web" /tmp/dsh-web.log
