name: Verify standalone DSH rc2 loading

on:
  push:
    branches: [main]
    paths:
      - src/**
      - package.json
      - cordis.patch.yml
      - .github/workflows/repro-rc2.yml

jobs:
  standalone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build current dsh-memory
        run: |
          npm install
          npm run typecheck
          npm run build
          npm pack
          mv dsh-memory-0.7.1.tgz /tmp/dsh-memory-0.7.1.tgz

      - name: Install DSH rc2 runtime
        run: |
          mkdir /tmp/runtime
          cd /tmp/runtime
          npm init -y >/dev/null
          npm install --no-fund --no-audit @deepseek-ai/dsh@0.1.5-rc.2 pnpm@11.26.0

      - name: Create profile with peer auto-install disabled
        run: |
          mkdir -p "$HOME/.dsh/profiles/test"
          cd "$HOME/.dsh/profiles/test"
          cat > package.json <<'EOF'
          {
            "name": "dsh-profile-test",
            "private": true,
            "dependencies": {
              "dsh-memory": "file:/tmp/dsh-memory-0.7.1.tgz"
            },
            "dsh": {
              "profile": {
                "bundles": [
                  "@deepseek-ai/dsh-base",
                  "@deepseek-ai/dsh-web-app",
                  "dsh-memory"
                ],
                "patchReload": "startup"
              }
            }
          }
          EOF
          cat > pnpm-workspace.yaml <<'EOF'
          packages:
            - .
          nodeLinker: hoisted
          autoInstallPeers: false
          EOF
          /tmp/runtime/node_modules/.bin/pnpm install

      - name: Standalone import smoke
        working-directory: /home/runner/.dsh/profiles/test
        run: |
          test ! -d node_modules/@deepseek-ai/dsh-tools
          node -e "import('dsh-memory').then(()=>console.log('IMPORT_OK'))"

      - name: Verify bundle composition on DSH rc2
        run: |
          /tmp/runtime/node_modules/.bin/dsh --profile test --dump-config | tee /tmp/config.txt
          grep -n "id: memory" /tmp/config.txt
          grep -n "memoryPolicy: guided" /tmp/config.txt
