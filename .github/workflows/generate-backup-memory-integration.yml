name: Generate DSH-Backup memory integration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/generate-backup-memory-integration.yml

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out DSH-Backup
        uses: actions/checkout@v4
        with:
          repository: xoykor/DSH-Backup
          ref: master
          path: backup
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pinned pnpm
        run: npm install -g pnpm@11.26.0

      - name: Configure robust-local peer policy
        working-directory: backup/dsh/profiles/robust-local
        run: |
          cat > pnpm-workspace.yaml <<'EOF'
          packages:
            - .

          nodeLinker: hoisted
          autoInstallPeers: false
          EOF

      - name: Install DSH-memory v0.7.0
        working-directory: backup/dsh/profiles/robust-local
        run: |
          pnpm add https://github.com/xoykor/DSH-memory/releases/download/v0.7.0/dsh-memory-0.7.0.tgz

          node <<'NODE'
          const fs = require('node:fs')
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          const bundles = pkg.dsh?.profile?.bundles
          if (!Array.isArray(bundles)) throw new Error('dsh.profile.bundles missing')
          if (!bundles.includes('dsh-memory')) bundles.push('dsh-memory')
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n')
          NODE

          pnpm install --frozen-lockfile

          test -f node_modules/dsh-memory/lib/index.js
          test -f node_modules/dsh-memory/cordis.patch.yml
          node -e "const p=require('./node_modules/dsh-memory/package.json'); if(p.version!=='0.7.0') process.exit(1)"

      - name: Emit generated files
        working-directory: backup/dsh/profiles/robust-local
        run: |
          echo '===PACKAGE_JSON_BASE64==='
          base64 -w0 package.json
          echo
          echo '===PNPM_LOCK_BASE64==='
          base64 -w0 pnpm-lock.yaml
          echo
          echo '===PNPM_WORKSPACE_BASE64==='
          base64 -w0 pnpm-workspace.yaml
          echo
          echo '===END_GENERATED_FILES==='
