name: Generate robust-local v0.7.1 lock

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/generate-backup-v071.yml

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: xoykor/DSH-Backup
          ref: master
          path: backup
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        run: npm install -g pnpm@11.26.0

      - name: Upgrade dsh-memory lock
        working-directory: backup/dsh/profiles/robust-local
        run: |
          pnpm add https://github.com/xoykor/DSH-memory/releases/download/v0.7.1/dsh-memory-0.7.1.tgz
          pnpm install --frozen-lockfile
          test -f node_modules/dsh-memory/lib/index.js
          test ! -d node_modules/@deepseek-ai/dsh-tools
          node -e "const p=require('./node_modules/dsh-memory/package.json'); if(p.version!=='0.7.1') process.exit(1)"
          node -e "import('dsh-memory').then(()=>console.log('IMPORT_OK'))"

      - name: Emit generated files
        working-directory: backup/dsh/profiles/robust-local
        run: |
          echo '===PACKAGE_JSON_BASE64==='
          base64 -w0 package.json
          echo
          echo '===PNPM_LOCK_BASE64==='
          base64 -w0 pnpm-lock.yaml
          echo
          echo '===END_GENERATED_FILES==='
